name: Publish Windows Release

"on":
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Windows build run ID
        type: string
        required: true
      tag:
        description: Windows release tag matching the app version, for example v0.11.0
        type: string
        required: true

  workflow_run:
    workflows: [Build Windows x64]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
  RELEASE_TAG: ${{ inputs.tag || 'v0.18.0' }}

jobs:
  release:
    if: >-
      github.repository == 'smithwhere/cike' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify successful Windows build
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = process.env.RELEASE_TAG;
            if (!/^\d+$/.test(process.env.SOURCE_RUN)) throw new Error('Invalid build run ID');
            const releaseTag = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.0$/;
            if (!releaseTag.test(tag) || tag !== `v${version}`) {
              throw new Error('Use vMAJOR.MINOR.0 to match the application version');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.SOURCE_RUN),
            });
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.path !== '.github/workflows/build-windows.yml' ||
                run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.head_branch !== 'main' || !['push', 'workflow_dispatch'].includes(run.event)) {
              throw new Error('The selected Windows build has not passed all checks');
            }
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!existing.draft) throw new Error('This release is already published');
            } catch (error) { if (error.status !== 404) throw error; }
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            // Start the three-part Windows release sequence at v0.11.0.
            let major = 0;
            let minor = 10;
            for (const release of releases) {
              const match = releaseTag.exec(release.tag_name);
              if (!match || release.draft || release.prerelease) continue;
              const filename = `CIKE-${release.tag_name.slice(1)}-windows-x64.zip`;
              if (!release.assets.some(asset => asset.name === filename && asset.state === 'uploaded' && asset.size > 0)) continue;
              const publishedMajor = Number(match[1]);
              const publishedMinor = Number(match[2]);
              if (publishedMajor > major || (publishedMajor === major && publishedMinor > minor)) {
                major = publishedMajor;
                minor = publishedMinor;
              }
            }
            const nextTag = `v${major}.${minor + 1}.0`;
            if (tag !== nextTag) throw new Error(`The next Windows release tag must be ${nextTag}`);
            core.setOutput('sha', run.head_sha);
            core.setOutput('filename', `CIKE-${version}-windows-x64.zip`);
            core.setOutput('build_url', run.html_url);
      - name: Confirm the artifact matches the application source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git diff --exit-code "$SOURCE_SHA" "$GITHUB_SHA" -- . \
            ':(exclude).github/workflows/publish-windows.yml' \
            ':(exclude)README.md' ':(exclude)docs/WINDOWS.md'
      - uses: actions/download-artifact@v4
        with:
          name: CIKE-windows-x64
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-files
      - name: Verify package checksum
        working-directory: release-files
        env:
          PACKAGE_NAME: ${{ steps.source.outputs.filename }}
        run: |
          test -s "$PACKAGE_NAME"
          sha256sum --check --strict SHA256SUMS.txt
      - name: Upload release files
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: CIKE ${{ env.RELEASE_TAG }} Windows x64
          draft: true
          prerelease: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            release-files/${{ steps.source.outputs.filename }}
            release-files/SHA256SUMS.txt
          body: |
            CIKE ${{ env.RELEASE_TAG }} Windows x64 免安装版。

            - Chromium 直连环境默认使用 Cloudflare（1.1.1.1）和 Google（8.8.8.8）的 DNS over HTTPS。
            - Camoufox 启动时优先尝试 Cloudflare，不可达时使用 Google。也可在「设置 → 网络」选单个服务或使用系统 DNS。
            - 代理环境继续由代理解析网站域名。DNS 设置保存后，重新打开环境即可生效。

            - 适用于 Windows 10/11 的 Intel、AMD 64 位电脑。
            - 下载 `${{ steps.source.outputs.filename }}`，完整解压后双击 `CIKE.exe`。首次使用时在「设置」下载 Chromium。
            - 数据默认保存在 `%LOCALAPPDATA%\CIKE`，程序更新时保留。

            更新时请完全退出 CIKE 和所有环境。将新版完整解压到新目录，再启动 `CIKE.exe`。应用继续使用现有数据目录。

            [本次发布的 Windows 构建与测试记录](${{ steps.source.outputs.build_url }})。

            [Windows 使用说明](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/WINDOWS.md)。

            该 Windows 移植包使用手动更新。下载后可用 `SHA256SUMS.txt` 校验压缩包。
      - name: Publish the completed release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          PACKAGE_NAME: ${{ steps.source.outputs.filename }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            for (const name of [process.env.PACKAGE_NAME, 'SHA256SUMS.txt']) {
              if (!release.assets.some(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0)) {
                throw new Error(`Missing release file: ${name}`);
              }
            }
            const { data: published } = await github.rest.repos.updateRelease({
              ...context.repo, release_id, draft: false, make_latest: 'true',
            });
            core.info(`Published ${published.html_url}`);
