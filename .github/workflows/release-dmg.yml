name: Build and Release DMG

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.5.11)'
        required: true

permissions:
  contents: write

jobs:
  build-dmg:
    if: github.repository == 'smithwhere/cike' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run test:unit
      - name: Install managed Chromium for regression tests
        run: |
          browser=$(node -e "const fs=require('fs'), os=require('os'), path=require('path'); require('./electron/chromium').downloadChromium(fs.mkdtempSync(path.join(os.tmpdir(),'cike-chromium-ci-'))).then(console.log).catch(error=>{console.error(error);process.exitCode=1})")
          test -x "$browser"
          printf 'LFB_CHROMIUM_EXECUTABLE=%s\n' "$browser" >> "$GITHUB_ENV"
      - run: npm test
      - name: Package macOS app
        run: |
          test -s electron/assets/icon.icns
          npx electron-packager . CIKE \
            --platform=darwin --arch=arm64 \
            --icon=electron/assets/icon.icns \
            --out=dist --overwrite --prune \
            '--ignore=^/(test|.browsers|dist)'
      - name: Verify packaged icon
        run: |
          ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/CIKE-darwin-arm64/CIKE.app/Contents/Info.plist)
          cmp electron/assets/icon.icns "dist/CIKE-darwin-arm64/CIKE.app/Contents/Resources/$ICON_NAME"
      - name: Ad-hoc sign and verify app
        run: |
          codesign --force --deep --sign - dist/CIKE-darwin-arm64/CIKE.app
          codesign --verify --deep --strict --verbose=2 dist/CIKE-darwin-arm64/CIKE.app
      - name: Verify packaged desktop app
        env:
          CIKE_TEST_APP: ${{ github.workspace }}/dist/CIKE-darwin-arm64/CIKE.app/Contents/MacOS/CIKE
        run: npm run test:desktop
      - name: Create DMG
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          brew install create-dmg
          mkdir -p dmg-staging
          cp -R dist/CIKE-darwin-arm64/CIKE.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          create-dmg --volname "CIKE" "CIKE-${RELEASE_VERSION}-mac-arm64.dmg" dmg-staging/
          hdiutil verify "CIKE-${RELEASE_VERSION}-mac-arm64.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/cike-verify" "CIKE-${RELEASE_VERSION}-mac-arm64.dmg"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/cike-verify/CIKE.app"
          hdiutil detach "$RUNNER_TEMP/cike-verify"
          tar -czf "CIKE-${RELEASE_VERSION}-mac-arm64.dmg.tar.gz" "CIKE-${RELEASE_VERSION}-mac-arm64.dmg"
          shasum -a 256 *.dmg *.dmg.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: CIKE v${{ inputs.version }}
          make_latest: true
          body: |
            CIKE macOS Apple Silicon 安装包。校验文件见 `SHA256SUMS.txt`。
            应用使用临时签名，尚无 Apple Developer ID 签名及公证。
            [本次构建与测试记录](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})。
            适用于苹果 M 系列芯片、macOS 13 及以上。
            安装后首次打开如被阻止，请前往「系统设置 → 隐私与安全性」选择「仍要打开」。
            完整安装说明及无法放行时的处理方法见仓库 README。
          files: |
            *.dmg
            *.dmg.tar.gz
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
